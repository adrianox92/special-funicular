        total_time:
          type: string
        laps:
          type: integer
        average_time:
          type: string
        lane:
          nullable: true
        circuit:
          type: string
          nullable: true
        circuit_id:
          type: string
          format: uuid
          nullable: true
        timing_date:
          type: string
        session_type:
          type: string
          nullable: true
        recorded_from:
          type: string
        sync_meta:
