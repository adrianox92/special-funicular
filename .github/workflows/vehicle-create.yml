name: Vehicle create regression

on:
  pull_request:
    branches:
      - staging
      - master
  push:
    branches:
      - staging
      - master

concurrency:
  group: vehicle-create-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-e2e:
    name: FormData + Multer + save-error log
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend create-vehicle e2e
        run: |
          npm ci
          npm run test:vehicle-create

  frontend-formdata:
    name: Frontend create FormData
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend FormData flows
        env:
          CI: true
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm test -- --watchAll=false --testPathPattern='buildCreateVehicleFormData|AddVehicle.create|vehicleCatalogItemId|catalogVehiclePrefill'
