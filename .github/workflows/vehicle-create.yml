name: Vehicle create regression

on:
  pull_request:
    branches:
      - staging
      - master
  push:
    branches:
      - staging
      - master

concurrency:
  group: vehicle-create-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vehicle-create:
    name: FormData + Multer + save-error log
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (backend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend create-vehicle e2e
        working-directory: backend
        run: |
          npm ci
          npm run test:vehicle-create

      - name: Setup Node (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend FormData flows
        working-directory: frontend
        env:
          CI: true
        run: |
          npm ci
          npm test -- --watchAll=false --testPathPattern='buildCreateVehicleFormData|AddVehicle.create|vehicleCatalogItemId|catalogVehiclePrefill'
